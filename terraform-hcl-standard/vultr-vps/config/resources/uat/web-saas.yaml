# UAT is intentionally a separate Terraform declaration and state/workspace.
# The CMDB generated after apply is the deploy source of truth; do not point a
# UAT run at a production host variable.
global:
  region: nrt
  name_prefix: ""
  user_data_file: cloud-init.yaml

ssh_keys:
  - name: ai-workspace-admin
    public: "ssh-rsa  shenlan@shenlandeMacBook-Air-2.local"

hosts:
  - name: console-nat.{{ env['TARGET_DOMAIN_BASE'] }}
    snapshot_id: {{ env.get('SNAPSHOT_ID_DEBIAN13_WEBSAAS', '415a1cd7-149f-4f4e-b904-072a179d90dc') | tojson }}
    os_name: "Debian 13 x64 (trixie)"
    plan: {{ env.get('INSTANCE_PLAN_API', 'vc2-4c-8gb') }}
    backups: true
    enable_ipv6: true
    ansible_user: root
    groups: [web_saas, debian, database]
    tags: [web-saas, uat, debian, database]
    host_vars:
      role: primary
      service_domains:
        - console-uat.{{ env['TARGET_DOMAIN_BASE'] }}
        # accounts 是 web-saas 栈里独立的对外站点: Caddyfile 给它单独一个
        # https:// 块(OAuth 回调固定落在这里, console 只是发起跳转的一方)。
        # 少了这条 A 记录, Caddy 的 ACME HTTP-01 验证拿不到解析、签不出证书,
        # 而 console 那个站点照常可用 —— 于是表现成"登录跳转过去就白屏"。
        - accounts-uat.{{ env['TARGET_DOMAIN_BASE'] }}
        # Billing job trigger 只允许 agent-proxy 通过 web-saas Caddy 访问；
        # 该域名与 agent-proxy CIDR matcher 配套生成。
        - billing-uat.{{ env['TARGET_DOMAIN_BASE'] }}
        - postgresql-saas-uat.{{ env['TARGET_DOMAIN_BASE'] }}
