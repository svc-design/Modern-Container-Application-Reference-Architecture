global:
  region: nrt
  name_prefix: agent-proxy-prod
  user_data_file: cloud-init.yaml

ssh_keys:
  - name: ai-workspace-admin
    # Derived by the deployment workflow from the Vault-managed private key.
    # This keeps the EC2 key pair and the Ansible key on the same rotation.
    public: "{{ env['SSH_PUBLIC_DEPLOY_KEY'] }}"

hosts:
  - name: agent-proxy-node-prod
    os_name: "Debian 13 x64 (trixie)"
    # 2 vCPU / 2 GiB, AWS Graviton (T4g), on-demand.
    plan: {{ env.get('AGENT_PROXY_PLAN_API', 't4g.small') }}
    billing_mode: on_demand
    elastic_ip: true
    # Reserved Instances are an account-level billing discount; when enabled
    # externally, AWS applies it automatically to this matching instance.
    reserved_instance: false
    # Stop is allowed; termination requires an explicit protection override.
    deletion_protection: true
    backups: false
    enable_ipv6: true
    # Debian's official AWS AMI installs the EC2 key for the admin account;
    # privilege escalation is handled by Ansible after the SSH connection.
    ansible_user: admin
    groups: [agent_proxy, debian]
    tags: [debian]
    # Agent Proxy's public transport endpoint. Keep this declaration beside
    # the host so the generated security group and the CMDB stay in sync.
    security_group_ingress:
      - port: 1443
        protocol: tcp
        cidr: 0.0.0.0/0
    host_vars:
      role: primary
      service_domains:
        - agent-proxy-selfhost-prod.{{ env['TARGET_DOMAIN_BASE'] }}
