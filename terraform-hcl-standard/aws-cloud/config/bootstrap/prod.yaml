# Production AWS GitHub Actions OIDC bootstrap.
#
# The OIDC declaration itself remains in the GitOps repository. The relative
# path is resolved from this file when `iac_modules` and `gitops` are checked
# out as sibling directories by the bootstrap workflow.
account_name: prod
account_id: "950604983695"
region: ap-northeast-1
environment: prod

github_actions_oidc:
  config_path: ../../../../../gitops/resources/svc.plus/prod/aws/github-actions-oidc.json

# This module is used to adopt the pre-created GitHub OIDC integration only.
# It must not create legacy Terraform AK/SK identities during that adoption.
iam:
  create_role: false
  create_user: false
  role_name: GithubAction_IAC_Deploy_Role
  terraform_user_name: terraform-bootstrap-prod

# Non-secret identity state location. Backend endpoint, bucket and credentials
# are loaded by the production workflow from Vault kv/data/CICD/prod/iac_state.
terraform_state:
  key: platform-ops-toolkit/prod/aws-cloud/bootstrap/identity/terraform.tfstate
