name: XConnect Overlay Contracts

on:
  pull_request:
    paths:
      - 'vpn-overlay/contracts/**'
      - '.github/workflows/xconnect-overlay-contracts.yml'
  push:
    branches:
      - 'codex/xconnect-*'
    paths:
      - 'vpn-overlay/contracts/**'
      - '.github/workflows/xconnect-overlay-contracts.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vpn-overlay/contracts/requirements.txt
      - name: Install contract validator
        run: python3 -m pip install -r vpn-overlay/contracts/requirements.txt
      - name: Validate schemas and fixtures
        run: vpn-overlay/contracts/scripts/validate.sh
